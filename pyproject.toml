[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mydealz-cli"
version = "0.1.0"
description = "mydealz – Agent-CLI für mydealz.de: Deals suchen, Details, Gutscheine, lokales Keyword-Watch."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "smlfg"}]
keywords = [
    "mydealz",
    "deals",
    "gutscheine",
    "coupons",
    "shopping",
    "cli",
    "agent",
    "scraper",
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
playwright = [
    "playwright>=1.45",
]

[project.scripts]
mydealz = "mydealz_cli.cli:main"

[project.urls]
Homepage = "https://github.com/smlfg/mydealz-cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mydealz_cli = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"